# Tools Catalog — Catálogo de Ferramentas Disponíveis

**Versão:** 1.0.0 · **Última atualização:** 2026-11-24

## Classificação

| Status | Significado |
|---|---|
| `available` | Disponível para uso sem autorização adicional |
| `pending_authorization` | Solicitado, aguardando aprovação do proprietário |
| `verified` | Autorizado, verificado e pronto para uso |
| `denied` | Solicitado e negado pelo proprietário |
| `deprecated` | Removido, não usar |

## Tipos de ferramenta

| `kind` | Mecanismo |
|---|---|
| `internal` | Implementação nativa do runtime OpenBot ou do Arquiteto |
| `mcp` | MCP server externo (Model Context Protocol) |
| `http` | Cliente HTTP com auth header |
| `cli` | Subprocesso local com allowlist |
| `architect_developed` | Implementação própria em `tools/developed/<tool_id>/` |

