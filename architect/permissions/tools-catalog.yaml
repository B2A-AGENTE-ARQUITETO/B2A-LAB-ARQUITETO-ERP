## Denylist (NUNCA acessar, mesmo com autorização)

| Host | Motivo |
|---|---|
| `appsite-erp-b2-a-engenharia.vercel.app` | ERP B2A em produção — acesso apenas via fluxo especial do AGENTS.md §11 |
| `n8nb2aengenharia.site` | Instância n8n do B2A — acesso apenas via fluxo especial |
| Hosts sob `supabase.co` cujo project refira-se ao B2A | Banco de dados do ERP B2A |

Tentativa de acessar qualquer host da denylist resulta em:
1. Bloqueio imediato pelo interceptor.
2. Log `kind=security_violation` em `memory/incidents.md`.
3. Suspensão do funcionário que tentou.
4. Notificação ao proprietário.

## Procedimento para solicitar nova ferramenta

Ver `knowledge/ecosystem/estrategia-integracao-ferramentas.md` seção "Acesso progressivo" e skill `tool-integration`.

Resumo:
1. Pesquisar candidatos em fontes públicas (ver skill `tool-integration`).
2. Registrar pesquisa em `memory/research-log.md`.
3. Abrir solicitação em `pending.md`.
4. Aguardar aprovação em `granted.md`.
5. Configurar conexão (sem secrets em arquivo).
6. Verificar com `tool.verify`.
7. Marcar como `verified` neste catálogo.
