# Casos de teste do funcionário
# Minimo 3 casos: normal, borda, erro
# Fixtures em tests/fixtures/ sao ficticios

cases:
  # Caso 1: situacao normal
  - id: case-001
    description: "<PLACEHOLDER_DESCRICAO_CASO_NORMAL>"
    input:
      type: "<PLACEHOLDER_TYPE>"          # document | message | file | ...
      content: "tests/fixtures/case-001.json"
    expected:
      kind: "<PLACEHOLDER_EXPECTED_KIND>"
      fields:
        - <PLACEHOLDER_EXPECTED_FIELD_1>
        - <PLACEHOLDER_EXPECTED_FIELD_2>
      confidence: ">= 0.85"
    criteria:
      must_extract:
        - <PLACEHOLDER_MUST_FIELD_1>
        - <PLACEHOLDER_MUST_FIELD_2>
      max_latency_ms: 5000
      max_tokens: 3000
    tags: [functional, normal]

  # Caso 2: situacao de borda
  - id: case-002
    description: "<PLACEHOLDER_DESCRICAO_CASO_BORDA>"
    input:
      type: "<PLACEHOLDER_TYPE>"
      content: "tests/fixtures/case-002.json"
    expected:
      kind: "<PLACEHOLDER_EXPECTED_KIND>"
      fields:
        - <PLACEHOLDER_EXPECTED_FIELD_1>
      confidence: ">= 0.80"
    criteria:
      must_extract:
        - <PLACEHOLDER_MUST_FIELD_1>
      max_latency_ms: 8000
      max_tokens: 4000
    tags: [functional, edge]

  # Caso 3: situacao de erro
  - id: case-003
    description: "<PLACEHOLDER_DESCRICAO_CASO_ERRO>"
    input:
      type: "<PLACEHOLDER_TYPE>"
      content: "tests/fixtures/case-003.json"
    expected:
      kind: "error"
      error_message_contains: "<PLACEHOLDER_ERROR_SUBSTRING>"
    criteria:
      must_not_extract: []               # nao deve produzir output em caso de erro
      max_latency_ms: 3000
      max_tokens: 2000
    tags: [functional, error]
